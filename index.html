<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#25c4dd" />
    <meta name="description" content="Une carte de l'Indonésie pour choisir les étapes du voyage d'août 2027." />
    <meta property="og:title" content="Indonésie, août 2027" />
    <meta property="og:description" content="Une carte de l'Indonésie pour choisir les étapes du voyage." />
    <meta property="og:type" content="website" />
    <title>Indonésie, août 2027</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌴%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <canvas id="scene" aria-label="Carte 3D de l'Indonésie"></canvas>
    <div id="labels"></div>

    <div id="app">
      <header class="topbar">
        <button class="brand" data-action="home" title="Revenir à la vue d'ensemble">
          <span class="brand__logo">🌴</span>
          <span class="brand__text"><strong>Indonésie</strong><small>Août 2027</small></span>
        </button>
        <button class="btn btn--sun" id="itinerary-toggle" data-action="itinerary" aria-pressed="false">Exemple d'itinéraire</button>
        <button class="btn btn--fav" id="favorites-toggle" data-action="favorites" aria-pressed="false" aria-label="Mes favoris">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" /></svg>
          <span class="wide">Mes favoris</span>
          <span class="btn__count"></span>
        </button>
        <button class="flat-chip" data-action="why-2d" title="Pourquoi ce mode ?">Mode compatibilité</button>
      </header>

      <aside id="panel" class="panel card" aria-live="polite"></aside>

      <div class="zoom" role="group" aria-label="Zoom">
        <button data-action="zoom" data-factor="0.6" aria-label="Zoomer">+</button>
        <button data-action="zoom" data-factor="1.65" aria-label="Dézoomer">−</button>
        <button data-action="help" aria-label="Aide pour se déplacer">?</button>
      </div>
      <div id="help" class="help">
        <p class="help__mouse">Glisser pour se déplacer, molette pour zoomer, clic droit pour tourner. Au clavier : flèches ou ZQSD, A et E pour tourner.</p>
        <p class="help__touch">Un doigt pour se déplacer, deux doigts pour zoomer et tourner.</p>
      </div>
    </div>

    <div id="intro" class="intro">
      <div class="intro__card">
        <p class="intro__kicker">Août 2027</p>
        <h1 class="intro__title" aria-label="Indonésie">
          <span>I</span><span>n</span><span>d</span><span>o</span><span>n</span><span>é</span><span>s</span><span>i</span><span>e</span>
        </h1>
        <p class="intro__sub">Cliquez sur une région pour voir ses étapes.</p>
        <button class="btn btn--start" id="start" data-action="start" disabled>Chargement…</button>
        <p class="intro__hint" id="start-hint" hidden>ou appuyez sur <kbd>Entrée</kbd></p>
        <p class="intro__error" id="boot-error" role="alert" hidden></p>
      </div>
    </div>

    <div id="toasts"></div>
    <script>
      // Si le site ne peut pas démarrer (navigateur trop ancien, 3D indisponible…), on l'explique au lieu de rester muet.
      [Array.prototype, String.prototype, Object.getPrototypeOf(Int8Array.prototype)].forEach(function (proto) {
        if (!proto.at)
          Object.defineProperty(proto, 'at', {
            value: function (i) {
              i = Math.trunc(i) || 0;
              return this[i < 0 ? i + this.length : i];
            },
            writable: true,
            configurable: true,
          });
      });
      window.showBootError = function (detail) {
        var el = document.getElementById('boot-error');
        if (!el || !el.hidden || document.body.className.indexOf('ready') >= 0) return;
        el.textContent =
          "Le site n'a pas pu démarrer sur ce navigateur. Essayez avec une version récente de Chrome, Firefox, Edge ou Safari." +
          (detail ? ' (' + detail + ')' : '');
        el.hidden = false;
        document.getElementById('start').textContent = 'Démarrage impossible';
      };
      window.addEventListener(
        'error',
        function (event) {
          var isScript = event.target && event.target.tagName === 'SCRIPT';
          if (event.message || isScript) window.showBootError(event.message || 'script introuvable');
        },
        true,
      );
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
